<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

    <!-- Typography: Space Grotesk (display) + DM Sans (body) + JetBrains Mono (labels, code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    >

    <!-- Primary Meta Tags -->
    <title>EXORIT — Custom Software, Web, Mobile and AI Development</title>
    <meta name="description" content="EXORIT designs and builds custom web platforms, mobile apps and AI systems for businesses in Australia, Europe, North America and Bangladesh. Written scope and quote before work starts, a working demo every week.">
    <meta name="keywords" content="AI development agency, AI product development, MVP development, RAG development, LLM integration, offshore development team, software agency Bangladesh, hire AI developers Australia">
    <meta name="author" content="EXORIT">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#007BFF">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://exorit.dev/">
    <meta property="og:title" content="EXORIT — Custom Software, Web, Mobile and AI Development">
    <meta property="og:description" content="Custom web platforms, mobile apps and AI systems — scoped to your business, with a working demo every week.">
    <meta property="og:image" content="https://exorit.dev/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="EXORIT">
    <meta property="og:locale" content="en_US">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@Exor_IT">
    <meta name="twitter:url" content="https://exorit.dev/">
    <meta name="twitter:title" content="EXORIT — Custom Software, Web, Mobile and AI Development">
    <meta name="twitter:description" content="Custom web platforms, mobile apps and AI systems — scoped to your business, with a working demo every week.">
    <meta name="twitter:image" content="https://exorit.dev/og-image.jpg">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://exorit.dev/" />

    <!-- Blog feed: a discovery signal for feed readers and the AI answer-engine
         crawlers that poll feeds for fresh content instead of re-crawling the
         whole site. Regenerate with scripts/generate-rss.mjs after a new post. -->
    <link rel="alternate" type="application/rss+xml" title="EXORIT Blog" href="https://exorit.dev/rss.xml" />

    <!-- Analytics: uncomment once the Plausible or GA4 account exists.
         BookingButton and the contact form already emit `booking_click` and
         `contact_submit` events to whichever of the two is present. -->
    <!-- <script defer data-domain="exorit.dev" src="https://plausible.io/js/script.js"></script> -->

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "EXORIT",
        "url": "https://exorit.dev",
        "logo": "https://exorit.dev/images/logo.svg",
        "image": "https://exorit.dev/og-image.jpg",
        "description": "Custom software development. We design and build web platforms, mobile applications and AI systems, scoped per project, with a working demo every week.",
        "foundingDate": "2025",
        "email": "exorit.official@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Dhaka",
          "addressRegion": "Dhaka",
          "addressCountry": "BD"
        },
        "areaServed": [
          { "@type": "Country", "name": "Australia" },
          { "@type": "Country", "name": "United States" },
          { "@type": "Country", "name": "Canada" },
          { "@type": "Country", "name": "United Kingdom" },
          { "@type": "Country", "name": "Bangladesh" }
        ],
        "knowsAbout": [
          "AI integration",
          "Large language model applications",
          "Retrieval augmented generation",
          "Data collection and preprocessing",
          "Web application development",
          "iOS and cross-platform mobile development",
          "UI/UX design"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+880-178-183-6541",
          "contactType": "sales",
          "availableLanguage": ["English", "Bengali"]
        },
        "sameAs": [
          "https://www.linkedin.com/company/exorit",
          "https://github.com/exorit",
          "https://x.com/Exor_IT"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
